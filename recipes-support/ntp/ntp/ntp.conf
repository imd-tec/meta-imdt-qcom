# This is the most basic ntp configuration file
# The driftfile must remain in a place specific to this
# machine - it records the machine specific clock error
driftfile /data/ntp/drift
# This should be a server that is close (in IP terms)
# to the machine.  Add other servers as required.
# Unless you un-comment the line below ntpd will sync
# only against the local system clock.
#
# server time.server.example.com
#
# Using local hardware clock as fallback
# Disable this when using ntpd -q -g -x as ntpdate or it will sync to itself
server 127.127.1.0
fudge 127.127.1.0 stratum 14

restrict 127.0.0.1    # allow local host
restrict ::1          # allow local host

# We have switched from using multiple time servers
# to using a single pool server. This is the better approach
# for configuring ntpd because ntpd will now fetch
# new time servers from the pool when a time server goes offline or is un-reachable.
# This does not happen when you use static timer servers ('server 0.npt.X.X')
# because they only do the DNS query on first boot and continue to use the returned IP address
# even when the IP address/time server becomes unreachable or goes offline.
pool pool.ntp.org iburst
